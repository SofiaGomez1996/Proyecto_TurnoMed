<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TurnoMed - Agenda</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #ffffff; }
        .header { background-color: #003366; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 40px; }
        table { width: 100%; border-collapse: collapse; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        th { background-color: #0077b6; color: white; padding: 15px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #caf0f8; }
        /* Estilo del botón celeste */
        .btn-asignar { background-color: #00b4d8; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-asignar:hover { background-color: #0077b6; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dr. Jonathan Triñanes</h1>
        <a href="/asignar-turno" class="btn-asignar">+ Asignar Turno</a>
    </div>

    <div class="container">
        <h2 style="color: #003366;">Turnos de la Agenda</h2>
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Paciente</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for t in turnos %}
                <tr>
                    <td>{{ t.hora }}</td>
                    <td>{{ t.paciente }}</td>
                    <td>{{ t.especialidad }}</td>
                    <td style="color: red; font-weight: bold;">{{ t.estado }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align: center;">No hay turnos cargados. ¡Dale al botón de arriba!</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
