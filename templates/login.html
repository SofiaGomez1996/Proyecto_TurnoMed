<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - TurnoMed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="auth-body">

<div class="auth-card">

    <img src="{{ url_for('static', filename='logo.png') }}" class="auth-logo">

    <h1>Bienvenido a <span>TurnoMed</span></h1>
    <p>Iniciá sesión para consultar o gestionar turnos.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alerta">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="auth-form">
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit">Ingresar</button>
    </form>

    <div class="auth-footer">
        <span>¿No tenés cuenta?</span>
        <a href="/registro">Crear cuenta de paciente</a>
    </div>

</div>

</body>
</html>
