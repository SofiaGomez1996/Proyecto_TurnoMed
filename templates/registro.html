<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<form method="POST" action="/registro" class="auth-form">

    <div class="form-grid">
        <input
            type="text"
            name="nombre"
            placeholder="Nombre"
            required
        >

        <input
            type="text"
            name="apellido"
            placeholder="Apellido"
            required
        >
    </div>

    <input
        type="text"
        name="dni"
        placeholder="DNI"
        required
    >

    <input
        type="text"
        name="telefono"
        placeholder="Teléfono"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Correo electrónico"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Contraseña"
        required
    >

    <button type="submit">
        Registrarme
    </button>

</form>
</body>
</html>
