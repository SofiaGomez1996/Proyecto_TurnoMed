<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <h2>Crear usuario</h2>

    <form method="POST">
        <label>Usuario:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Contraseña:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Registrarse</button>
    </form>

    <br>
    <a href="{{ url_for('login') }}">Volver al login</a>
</body>
</html>
