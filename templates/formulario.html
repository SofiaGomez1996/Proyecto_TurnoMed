<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Turno</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #00b4d8; border-radius: 4px; }
        button { background-color: #004a99; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #004a99;">Nuevo Turno</h2>
        <form action="/asignar_turno" method="POST">

            <label>Paciente:</label>
            <select name="id_paciente" required>
                <option value="">-- Seleccioná un paciente --</option>
                {% for p in pacientes %}
                    <option value="{{ p.id_usuario }}">{{ p.apellido }}, {{ p.nombre }}</option>
                {% endfor %}
            </select>

            <label>Horario disponible:</label>
            <select name="id_horario" required>
                <option value="">-- Seleccioná un horario --</option>
                {% for h in horarios %}
                    <option value="{{ h.id_horario }}">
                        {{ h.fecha }} {{ h.hora }} — {{ h.medico }} ({{ h.especialidad }})
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Guardar Turno</button>
        </form>
    </div>
</body>
</html>
